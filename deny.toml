# cargo-deny 策略：许可证白名单 + 已知漏洞 + 重复依赖告警。
[graph]
targets = []

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 内部 path 依赖通过 workspace 继承，版本约束为空是预期行为。
allow-wildcard-paths = true

[sources]
unknown-registry = "warn"
unknown-git = "warn"
