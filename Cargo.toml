[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
publish = false

[workspace.dependencies]
rscmd-core = { path = "crates/rscmd-core" }
rscmd-runtime = { path = "crates/rscmd-runtime" }
rscmd-tools = { path = "crates/rscmd-tools" }
rscmd-tool-text = { path = "crates/rscmd-tool-text" }
rscmd-tool-data = { path = "crates/rscmd-tool-data" }
rscmd-tool-crypto = { path = "crates/rscmd-tool-crypto" }
rscmd-tool-system = { path = "crates/rscmd-tool-system" }
rscmd-tool-net = { path = "crates/rscmd-tool-net" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
pythonize = "0.24"
rayon = "1"
urlencoding = "2"
csv = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }
schemars = { version = "0.9", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "1"
sha2 = "0.10"
ctrlc = "3"
zip = { version = "3", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
toml = "0.9"
serde_norway = "0.9"
# GUI POC：仅 rscmd-gui 的 gui feature 启用，默认门禁不编译。
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["bmp", "ico", "png"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
