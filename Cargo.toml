[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
publish = false

[workspace.dependencies]
rscmd-core = { path = "crates/rscmd-core" }
rscmd-runtime = { path = "crates/rscmd-runtime" }
rscmd-tools = { path = "crates/rscmd-tools" }
rscmd-tool-text = { path = "crates/rscmd-tool-text" }
rscmd-tool-data = { path = "crates/rscmd-tool-data" }
rscmd-tool-crypto = { path = "crates/rscmd-tool-crypto" }
rscmd-tool-system = { path = "crates/rscmd-tool-system" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
pythonize = "0.24"
rayon = "1"
urlencoding = "2"
schemars = { version = "0.9", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "1"
sha2 = "0.10"
ctrlc = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
