[package]
name = "rscmd-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["text", "data", "crypto", "system"]
text = ["dep:rscmd-tool-text"]
data = ["dep:rscmd-tool-data"]
crypto = ["dep:rscmd-tool-crypto"]
system = ["dep:rscmd-tool-system"]
all-tools = ["text", "data", "crypto", "system"]

[dependencies]
rscmd-core = { workspace = true }
rscmd-tool-text = { workspace = true, optional = true }
rscmd-tool-data = { workspace = true, optional = true }
rscmd-tool-crypto = { workspace = true, optional = true }
rscmd-tool-system = { workspace = true, optional = true }
